[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renti-backend"
version = "0.1.0"
description = "Renti (Rekan Berhenti) - AI Companion Chatbot backend (Gemastik XIX, Pengembangan Perangkat Lunak)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "litellm>=1.40",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
